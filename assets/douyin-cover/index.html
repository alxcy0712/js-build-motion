<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>统一视频封面模板</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #efeee9; color: #24231f; font: 14px/1.6 "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 1480px; margin: auto; padding: 42px 40px; }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.8px; }
  .intro { margin: 0 0 30px; color: #737168; }
  .workspace { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
  aside { padding: 22px; background: #fff; border-radius: 16px; }
  label { display: block; margin-bottom: 18px; font-weight: 600; }
  input, select { display: block; width: 100%; margin-top: 7px; padding: 10px 11px; border: 1px solid #d4d1c7; border-radius: 8px; color: #24231f; background: #fff; font: inherit; }
  input[type=file] { font-size: 12px; padding: 8px; }
  input[type=range] { padding: 0; border: 0; height: 24px; accent-color: #ffc712; cursor: pointer; }
  #avatar-size-value { float: right; color: #737168; font-weight: 500; font-variant-numeric: tabular-nums; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid #b48700; outline-offset: 3px; }
  .note { margin: 6px 0 20px; font-size: 12px; color: #737168; }
  .swatch { display: inline-block; width: 13px; height: 13px; margin-right: 7px; vertical-align: -2px; background: #ffc712; border-radius: 50%; }
  button { cursor: pointer; border: 0; border-radius: 9px; padding: 10px 14px; font: inherit; font-size: 13px; font-weight: 600; background: #ffc712; color: #24231f; }
  button:hover { filter: brightness(.96); }
  button:disabled { cursor: wait; opacity: .6; }
  #reset { background: #f1f0eb; width: 100%; }
  #remove-hero { background: #f1f0eb; width: 100%; margin-bottom: 12px; }
  #remove-hero:disabled { cursor: default; }
  .previews { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 4fr); gap: 24px; align-items: start; }
  figure { margin: 0; min-width: 0; }
  canvas { display: block; width: 100%; height: auto; border-radius: 3px; box-shadow: 0 8px 25px #24231f0c; }
  figcaption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  figcaption strong { display: block; font-size: 14px; }
  figcaption span { color: #737168; font-size: 12px; }
  #status { min-height: 23px; margin: 22px 0 0; color: #737168; }
  @media (max-width: 1000px) { main { padding: 28px 22px; } .workspace { grid-template-columns: 215px minmax(0, 1fr); gap: 22px; } .previews { grid-template-columns: 1fr; } }
  @media (max-width: 620px) { .workspace { grid-template-columns: 1fr; } aside { padding: 20px; } .previews { gap: 32px; } }
</style>
<main>
  <h1>统一视频封面模板</h1>
  <p class="intro">替换短标题和主题图，两种比例同步更新。留白、头像、字体与强调色保持统一。</p>
  <div class="workspace">
    <aside aria-label="封面内容">
      <label>栏目<select id="kicker">
        <option value="AI 创作">AI 创作</option>
        <option value="AI 工具">AI 工具</option>
        <option value="编程开发">编程开发</option>
        <option value="创作技巧">创作技巧</option>
        <option value="">隐藏栏目</option>
      </select></label>
      <label>标题 · 第一行<input id="line1" maxlength="12" value="用 AI"></label>
      <label>标题 · 第二行<input id="line2" maxlength="12" value="做封面"></label>
      <p class="note">建议每行 3–6 个字，最多两行。长标题会自动缩小。</p>
      <label>替换 AI 主题图<input id="hero-file" type="file" accept="image/png,image/webp,image/jpeg"></label>
      <button id="remove-hero" type="button" disabled>删除主题图</button>
      <p class="note">推荐透明 PNG。删除主题图后，标题居中布局，文字左对齐。</p>
      <label>头像表情<select id="avatar-expression" disabled>
        <option value="default">默认头像</option>
      </select></label>
      <label>头像朝向<select id="avatar-view" disabled><option value="front">正面</option><option value="left45">左 45°</option><option value="right45">右 45°</option></select></label>
      <label for="avatar-size">头像大小<output id="avatar-size-value" for="avatar-size">100%</output><input id="avatar-size" type="range" min="50" max="150" step="1" value="100" disabled></label>
      <p class="note"><i class="swatch"></i>固定强调色 #FFC712</p>
      <button id="reset" type="button">恢复示例</button>
    </aside>
    <section aria-label="封面预览">
      <div class="previews">
        <figure>
          <canvas id="portrait" width="1080" height="1440" aria-label="3:4 竖版封面预览"></canvas>
          <figcaption><div><strong>竖版 3:4</strong><span>1080 × 1440</span></div><button type="button" data-format="portrait" disabled>导出 PNG</button></figcaption>
        </figure>
        <figure>
          <canvas id="landscape" width="1440" height="1080" aria-label="4:3 横版封面预览"></canvas>
          <figcaption><div><strong>横版 4:3</strong><span>1440 × 1080</span></div><button type="button" data-format="landscape" disabled>导出 PNG</button></figcaption>
        </figure>
      </div>
      <p id="status" role="status" aria-live="polite">正在加载模板…</p>
    </section>
  </div>
</main>
<script src="./template.js"></script>
<script>
  const fields = ['kicker', 'line1', 'line2'].map(id => document.getElementById(id));
  const status = document.getElementById('status');
  const buttons = [...document.querySelectorAll('[data-format]')];
  const canvases = ['portrait', 'landscape'].map(id => document.getElementById(id));
  const avatarSelect = document.getElementById('avatar-expression');
  const avatarView = document.getElementById('avatar-view');
  const avatarSize = document.getElementById('avatar-size');
  const avatarSizeValue = document.getElementById('avatar-size-value');
  const removeHero = document.getElementById('remove-hero');
  const heroFile = document.getElementById('hero-file');
  let hero, avatar, sampleHero, objectUrl;
  let avatars;
  let ready = false;
  let fileRevision = 0;
  const loadImage = src => new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error('图片加载失败，请使用 PNG、WebP 或 JPEG。'));
    image.src = src;
  });
  function update() {
    avatarSizeValue.value = avatarSize.value + '%';
    if (!ready) return;
    removeHero.disabled = !hero;
    try {
      const lines = fields.slice(1).map(input => input.value);
      for (const canvas of canvases) DouyinCover.draw(canvas, { format: canvas.id, kicker: fields[0].value, lines, hero, avatar, avatarScale: Number(avatarSize.value) / 100 });
      buttons.forEach(button => button.disabled = false);
      status.textContent = '两个比例已同步，可以导出。';
    } catch (error) {
      buttons.forEach(button => button.disabled = true);
      status.textContent = error.message;
    }
  }
  fields[0].addEventListener('change', update);
  fields.slice(1).forEach(input => input.addEventListener('input', update));
  avatarSize.addEventListener('input', update);
  const selectAvatar = () => {
    avatar = avatars.get(avatarSelect.value + ':' + avatarView.value);
    update();
  };
  avatarSelect.addEventListener('change', selectAvatar);
  avatarView.addEventListener('change', selectAvatar);
  heroFile.addEventListener('change', async event => {
    const file = event.target.files[0];
    if (!file) return;
    const revision = ++fileRevision;
    const url = URL.createObjectURL(file);
    try {
      const image = await loadImage(url);
      if (revision !== fileRevision) { URL.revokeObjectURL(url); return; }
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = url;
      hero = image;
      update();
    } catch (error) {
      URL.revokeObjectURL(url);
      if (revision === fileRevision) status.textContent = error.message;
    }
  });
  removeHero.addEventListener('click', () => {
    ++fileRevision;
    heroFile.value = '';
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = undefined;
    hero = undefined;
    update();
  });
  document.getElementById('reset').addEventListener('click', () => {
    if (!ready) return;
    ++fileRevision;
    fields[0].value = DouyinCover.defaults.kicker;
    fields[1].value = DouyinCover.defaults.lines[0];
    fields[2].value = DouyinCover.defaults.lines[1];
    heroFile.value = '';
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = undefined;
    hero = sampleHero;
    avatarSelect.value = 'default';
    avatarView.value = 'front';
    avatarSize.value = DouyinCover.defaults.avatarScale * 100;
    avatar = avatars.get('default:front');
    update();
  });
  buttons.forEach(button => button.addEventListener('click', () => {
    document.getElementById(button.dataset.format).toBlob(blob => {
      if (!blob) { status.textContent = '导出失败，请重新加载模板。'; return; }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'cover-' + button.dataset.format + '.png';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  }));
  async function initialize() {
    const expressions = await fetch('/personal-ip/expressions.json', {cache:'no-store'}).then(response => {
      if (!response.ok) throw new Error('表情目录加载失败，请刷新页面。');
      return response.json();
    });
    for (const item of expressions) avatarSelect.add(new Option(item.label, item.id));
    const entries = [{id:'default', views:{front:'portrait.png',left45:'expressions/left45/neutral.png',right45:'expressions/right45/neutral.png'}}, ...expressions];
    const [heroImage, avatarImages] = await Promise.all([
      loadImage('./images/image-card.png'),
      Promise.all(entries.flatMap(item => Object.entries(item.views).map(async ([view, path]) => [item.id + ':' + view, await loadImage('/personal-ip/' + path)]))),
    ]);
    hero = heroImage;
    sampleHero = hero;
    avatars = new Map(avatarImages);
    avatar = avatars.get(avatarSelect.value + ':' + avatarView.value);
    ready = true;
    avatarSelect.disabled = false;
    avatarView.disabled = false;
    avatarSize.disabled = false;
    update();
  }
  initialize().catch(error => status.textContent = error.message);
</script>
</html>
